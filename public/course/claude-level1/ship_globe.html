<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>3D 지구본 · 우리 배가 다니는 항로</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#03070f;color:#eaf1ff;
  font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",-apple-system,sans-serif}
#stage{position:relative;width:100%;height:100%}
canvas{display:block;width:100%;height:100%;cursor:grab}
canvas.drag{cursor:grabbing}
/* 좌측 패널 */
#side{position:absolute;top:16px;left:16px;width:290px;max-height:calc(100% - 32px);
  display:flex;flex-direction:column;gap:11px;z-index:5}
.panel{background:rgba(10,18,38,.86);border:1px solid rgba(126,166,255,.28);border-radius:15px;
  padding:14px 16px;backdrop-filter:blur(9px);box-shadow:0 16px 40px rgba(0,0,0,.5)}
h1{font-size:18px;font-weight:900;letter-spacing:-.4px;line-height:1.3}
h1 span{color:#7ea6ff}
.sub{font-size:11.5px;color:#9fb0cf;font-weight:700;margin-top:5px;line-height:1.55}
.lbl{font-size:10px;font-weight:900;letter-spacing:.13em;color:#7ea6ff;margin-bottom:8px}
#routes{display:flex;flex-direction:column;gap:5px;overflow-y:auto;max-height:330px;padding-right:3px}
#routes::-webkit-scrollbar{width:6px}
#routes::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:6px}
.rt{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:9px;cursor:pointer;
  border:1px solid transparent;transition:.15s}
.rt:hover{background:rgba(255,255,255,.07)}
.rt.on{background:rgba(47,107,255,.24);border-color:rgba(126,166,255,.6)}
.rt .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 8px currentColor}
.rt .nm{flex:1;min-width:0}
.rt .nm b{display:block;font-size:12.5px;font-weight:900;color:#eaf1ff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt .nm span{display:block;font-size:10.5px;font-weight:700;color:#9fb0cf;margin-top:1px}
.rt .km{font-size:11px;font-weight:900;color:#7ea6ff;white-space:nowrap}
#info{display:flex;flex-direction:column;gap:8px}
#info .big{font-size:17px;font-weight:900;color:#fff;line-height:1.3}
#info .row{display:flex;justify-content:space-between;align-items:baseline;
  padding:6px 0;border-top:1px solid rgba(255,255,255,.1)}
#info .row b{font-size:11.5px;font-weight:800;color:#9fb0cf}
#info .row i{font-style:normal;font-size:15px;font-weight:900;color:#fff}
#info .row i em{font-style:normal;font-size:11px;color:#9fb0cf;font-weight:800;margin-left:3px}
.tagline{font-size:11px;font-weight:800;color:#8ff0c6;background:rgba(61,220,155,.14);
  border:1px solid rgba(61,220,155,.4);border-radius:8px;padding:5px 9px;display:inline-block}
/* 우측 상단 */
#top{position:absolute;top:16px;right:16px;z-index:5;display:flex;gap:8px}
.tb{background:rgba(10,18,38,.86);border:1px solid rgba(126,166,255,.28);border-radius:10px;
  padding:8px 13px;font-size:12px;font-weight:900;color:#cfe0ff;cursor:pointer;
  backdrop-filter:blur(9px);font-family:inherit}
.tb:hover{background:rgba(47,107,255,.3);color:#fff}
.tb.on{background:rgba(47,107,255,.36);border-color:#7ea6ff;color:#fff}
#hint{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);z-index:5;
  font-size:11.5px;font-weight:800;color:#8b98b4;background:rgba(10,18,38,.75);
  border:1px solid rgba(255,255,255,.12);border-radius:9px;padding:7px 15px;backdrop-filter:blur(6px)}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:12px;background:#03070f;z-index:20;transition:opacity .5s}
#loading.off{opacity:0;pointer-events:none}
#loading .sp{width:38px;height:38px;border:3px solid rgba(126,166,255,.25);border-top-color:#7ea6ff;
  border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading p{font-size:13px;font-weight:800;color:#9fb0cf}
@media (max-width:820px){#side{width:230px}#routes{max-height:180px}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>

  <div id="side">
    <div class="panel">
      <h1>🌏 <span>우리 배가 다니는 길</span></h1>
      <div class="sub">부산에서 출발하는 <b style="color:#eaf1ff">주요 항로</b><br>
        드래그로 지구를 돌려보세요.</div>
    </div>
    <div class="panel" style="min-height:0;display:flex;flex-direction:column">
      <div class="lbl">항로 목록 · 눌러보세요</div>
      <div id="routes"></div>
    </div>
    <div class="panel" id="infoPanel">
      <div class="lbl">선택한 항로</div>
      <div id="info"></div>
    </div>
  </div>

  <div id="top">
    <button class="tb on" id="btnSpin" onclick="toggleSpin()">⟳ 자동 회전</button>
    <button class="tb" onclick="showAll()">전체 항로</button>
    <button class="tb" onclick="resetView()">초기화</button>
  </div>

  <div id="hint">드래그: 회전 · 휠: 확대/축소 · 항구를 클릭해보세요</div>

  <div id="loading"><div class="sp"></div><p>지구를 그리는 중…</p></div>
</div>

/* ═══════════ 기본 수학 ═══════════ */
const D2R = Math.PI/180;
function v3(lat,lon){
  const a=lat*D2R, b=lon*D2R;
  return [Math.cos(a)*Math.sin(b), Math.sin(a), Math.cos(a)*Math.cos(b)];
}
function dot(a,b){ return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]; }
function norm(a){ const l=Math.hypot(a[0],a[1],a[2]); return [a[0]/l,a[1]/l,a[2]/l]; }
function slerp(a,b,t){
  let d=Math.min(1,Math.max(-1,dot(a,b)));
  const o=Math.acos(d);
  if(o<1e-6) return a.slice();
  const s=Math.sin(o), w1=Math.sin((1-t)*o)/s, w2=Math.sin(t*o)/s;
  return [a[0]*w1+b[0]*w2, a[1]*w1+b[1]*w2, a[2]*w1+b[2]*w2];
}
function gcKm(a,b){ return 6371*Math.acos(Math.min(1,Math.max(-1,dot(a,b)))); }

let yaw=0, pitch=0, spin=true, lastMove=0;
let targetYaw=null, targetPitch=null;

function shortest(from,to){
  let d=(to-from)%(Math.PI*2);
  if(d>Math.PI) d-=Math.PI*2;
  if(d<-Math.PI) d+=Math.PI*2;
  return from+d;
}
function lookAt(lat,lon){
  const v=v3(lat,lon);
  return [Math.atan2(v[0],v[2]), Math.asin(v[1])];
}
function rot(v){
  // yaw(Y축) → pitch(X축)
  const cy1=Math.cos(yaw), sy=Math.sin(yaw);
  let x=v[0]*cy1 - v[2]*sy, y=v[1], z=v[0]*sy + v[2]*cy1;
  const cp=Math.cos(pitch), sp=Math.sin(pitch);
  const y2=y*cp - z*sp, z2=y*sp + z*cp;
  return [x,y2,z2];
}
function proj(v){ const r=rot(v); return [cx+r[0]*R, cy-r[1]*R, r[2]]; }

/* ═══════════ 지구 점 만들기 ═══════════ */
let landBits=null, dots=[];
function decodeMask(b64){
  const bin=atob(b64), n=bin.length, u=new Uint8Array(n);
  for(let i=0;i<n;i++) u[i]=bin.charCodeAt(i);
  return u;
}
function isLand(lat,lon){
  let x=Math.floor((lon+180)/MSTEP), y=Math.floor((lat+90)/MSTEP);
  if(x<0)x+=MW; if(x>=MW)x-=MW;
  if(y<0||y>=MH) return false;
  const i=y*MW+x;
  return (landBits[i>>3] >> (7-(i&7))) & 1;
}
function buildDots(){
  dots=[];
  const STEP=1.35;
  for(let lat=-88; lat<=88; lat+=STEP){
    const c=Math.cos(lat*D2R);
    const n=Math.max(6, Math.round(430*c));
    for(let k=0;k<n;k++){
      const lon=-180 + 360*k/n;
      if(isLand(lat,lon)) dots.push(v3(lat,lon));
    }
  }
}

function buildRoutes(){
  routes = PORTS.map((p,i)=>{
    const wps = p.wp.map(w=>v3(w[0],w[1]));
    const pts=[]; let km=0;
    const LIFT=1.014;
    for(let k=0;k<wps.length-1;k++){
      const a=wps[k], b=wps[k+1];
      const ang=Math.acos(Math.min(1,Math.max(-1,dot(a,b))));
      km += 6371*ang;
      const n=Math.max(3, Math.round(ang*90));
      for(let q=0;q<n;q++){
        const v=slerp(a,b,q/n);
        pts.push([v[0]*LIFT, v[1]*LIFT, v[2]*LIFT]);
      }
    }
    const e=wps[wps.length-1];
    pts.push([e[0]*LIFT, e[1]*LIFT, e[2]*LIFT]);
    const end=p.wp[p.wp.length-1];
    const v=v3(end[0],end[1]);
    const days=km/(SPEED_KN*1.852*24);
    return {...p, lat:end[0], lon:end[1], v, km, pts, days, tt:Math.random(), draw:0, idx:i};
  });
}

/* ═══════════ 그리기 ═══════════ */
let tPrev=0;
function frame(ts){
  const dt=Math.min(50, ts-tPrev)||16; tPrev=ts;
  if(spin && ts-lastMove>1500) yaw -= dt*0.00006;   /* 지구 자전 방향 */
  if(targetYaw!==null){
    yaw += (targetYaw-yaw)*0.08; pitch += (targetPitch-pitch)*0.08;
    if(Math.abs(targetYaw-yaw)<0.002){ targetYaw=null; targetPitch=null; }
  }
  draw(dt);
  requestAnimationFrame(frame);
}

let labelBoxes=[];
function freeBox(x,y,w,h){
  for(const b of labelBoxes)
    if(x<b[0]+b[2]&&x+w>b[0]&&y<b[1]+b[3]&&y+h>b[1]) return false;
  labelBoxes.push([x,y,w,h]); return true;
}
function draw(dt){
  labelBoxes=[];
  ctx.clearRect(0,0,W,H);
  // 별
  ctx.fillStyle='#fff';
  for(const s of stars){ ctx.globalAlpha=s[3]; ctx.fillRect(s[0],s[1],s[2],s[2]); }
  ctx.globalAlpha=1;

  // 대기광
  const g=ctx.createRadialGradient(cx,cy,R*0.86,cx,cy,R*1.28);
  g.addColorStop(0,'rgba(47,107,255,.30)');
  g.addColorStop(.55,'rgba(47,107,255,.09)');
  g.addColorStop(1,'rgba(47,107,255,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,R*1.28,0,7); ctx.fill();

  // 바다
  const og=ctx.createRadialGradient(cx-R*.3,cy-R*.35,R*.05,cx,cy,R);
  og.addColorStop(0,'#12325f'); og.addColorStop(.6,'#0a1c3a'); og.addColorStop(1,'#050d1e');
  ctx.fillStyle=og; ctx.beginPath(); ctx.arc(cx,cy,R,0,7); ctx.fill();

  // 위경도 격자
  ctx.strokeStyle='rgba(126,166,255,.10)'; ctx.lineWidth=1;
  for(let lat=-60; lat<=60; lat+=30){
    ctx.beginPath(); let started=false;
    for(let lon=-180; lon<=180; lon+=4){
      const p=proj(v3(lat,lon));
      if(p[2]>0){ started? ctx.lineTo(p[0],p[1]) : (ctx.moveTo(p[0],p[1]), started=true); }
      else started=false;
    }
    ctx.stroke();
  }
  for(let lon=-180; lon<180; lon+=30){
    ctx.beginPath(); let started=false;
    for(let lat=-88; lat<=88; lat+=4){
      const p=proj(v3(lat,lon));
      if(p[2]>0){ started? ctx.lineTo(p[0],p[1]) : (ctx.moveTo(p[0],p[1]), started=true); }
      else started=false;
    }
    ctx.stroke();
  }

  // 육지 점
  const ds=Math.max(1.1, R*0.0075);
  for(const d of dots){
    const r=rot(d);
    if(r[2]<=0.02) continue;
    const a=0.30+0.62*r[2];
    ctx.fillStyle='rgba(150,205,255,'+a.toFixed(3)+')';
    ctx.fillRect(cx+r[0]*R-ds/2, cy-r[1]*R-ds/2, ds, ds);
  }

  // 항로
  routes.forEach((rt,i)=>{
    const active = showAllMode || i===sel;
    if(!active) return;
    rt.draw = Math.min(1, rt.draw + dt*0.0011);
    const focus = (i===sel);
    const alpha = focus? 1 : (sel>=0? .28 : .8);
    const lw = focus? 2.6 : 1.7;

    ctx.lineWidth=lw; ctx.lineCap='round';
    const upto=Math.floor(rt.pts.length*rt.draw);
    ctx.beginPath(); let started=false;
    for(let k=0;k<upto;k++){
      const p=proj(rt.pts[k]);
      if(p[2]>-0.15){ started? ctx.lineTo(p[0],p[1]) : (ctx.moveTo(p[0],p[1]), started=true); }
      else started=false;
    }
    ctx.strokeStyle=hex(rt.c, alpha*.85);
    ctx.shadowColor=hex(rt.c,.9); ctx.shadowBlur=focus?14:7;
    ctx.stroke(); ctx.shadowBlur=0;

    // 배
    if(rt.draw>=1){
      rt.tt += dt*(focus?0.00022:0.00012);
      if(rt.tt>1) rt.tt=0;
      const k=Math.floor(rt.tt*(rt.pts.length-1));
      const p=proj(rt.pts[k]);
      if(p[2]>0){
        // 꼬리
        ctx.beginPath(); let st=false;
        for(let j=Math.max(0,k-14); j<=k; j++){
          const q=proj(rt.pts[j]);
          if(q[2]>0){ st? ctx.lineTo(q[0],q[1]) : (ctx.moveTo(q[0],q[1]), st=true); }
        }
        ctx.strokeStyle=hex(rt.c,alpha); ctx.lineWidth=lw+1.4; ctx.stroke();
        ctx.fillStyle='#fff'; ctx.shadowColor=hex(rt.c,1); ctx.shadowBlur=12;
        ctx.beginPath(); ctx.arc(p[0],p[1],focus?4:3,0,7); ctx.fill(); ctx.shadowBlur=0;
      }
    }
  });

  // 주요 해협 · 운하
  const chNames = (sel>=0 && routes[sel].ch) ? routes[sel].ch : [];
  CHOKE.forEach(c=>{
    const p=proj(v3(c.lat,c.lon));
    if(p[2]<=0.02) return;
    const hot = chNames.indexOf(c.n)>=0;
    ctx.save();
    ctx.translate(p[0],p[1]); ctx.rotate(Math.PI/4);
    ctx.fillStyle = hot? 'rgba(255,206,106,.95)' : 'rgba(180,205,255,.35)';
    if(hot){ ctx.shadowColor='#ffce6a'; ctx.shadowBlur=10; }
    const sz = hot? 6 : 3.6;
    ctx.fillRect(-sz/2,-sz/2,sz,sz);
    ctx.restore(); ctx.shadowBlur=0;
    if(hot){
      ctx.font='800 11px "Malgun Gothic",sans-serif';
      const w=ctx.measureText(c.n).width;
      ctx.fillStyle='rgba(6,15,36,.88)';
      rr(p[0]-w/2-7, p[1]+9, w+14, 18, 5); ctx.fill();
      ctx.strokeStyle='rgba(255,206,106,.5)'; ctx.lineWidth=1;
      rr(p[0]-w/2-7, p[1]+9, w+14, 18, 5); ctx.stroke();
      ctx.fillStyle='#ffce6a'; ctx.fillText(c.n, p[0]-w/2, p[1]+22);
      labelBoxes.push([p[0]-w/2-7, p[1]+9, w+14, 18]);
    }
  });

  // 허브 라벨 자리 예약
  {
    const hp0=proj(hubV);
    if(hp0[2]>0){
      ctx.font='900 13px "Malgun Gothic",sans-serif';
      labelBoxes.push([hp0[0]+11, hp0[1]-11, ctx.measureText(HUB.n).width+15, 22]);
      labelBoxes.push([hp0[0]-34, hp0[1]-34, 68, 68]);
    }
  }

  // 항구
  routes.forEach((rt,i)=>{
    const p=proj(rt.v);
    if(p[2]<=0) return;
    const focus=(i===sel);
    const dim = (sel>=0 && !focus) ? .35 : 1;
    ctx.fillStyle=hex(rt.c,dim); ctx.shadowColor=hex(rt.c,1); ctx.shadowBlur=focus?14:8;
    ctx.beginPath(); ctx.arc(p[0],p[1],focus?5.5:3.8,0,7); ctx.fill(); ctx.shadowBlur=0;
    if(focus){
      const pr=(Date.now()%1400)/1400;
      ctx.strokeStyle=hex(rt.c,(1-pr)*.9); ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(p[0],p[1],5.5+pr*17,0,7); ctx.stroke();
    }
    if(focus || (sel<0 && p[2]>.42)){
      ctx.font='700 12px "Malgun Gothic",sans-serif';
      const w=ctx.measureText(rt.n).width;
      if(freeBox(p[0]+9, p[1]-9, w+13, 19) || focus){
        ctx.fillStyle='rgba(6,15,36,.86)';
        rr(p[0]+9, p[1]-9, w+13, 19, 5); ctx.fill();
        ctx.fillStyle=focus?'#fff':hex(rt.c,.95);
        ctx.fillText(rt.n, p[0]+15, p[1]+4.5);
      }
    }
  });

  // 허브(남해안)
  const hp=proj(hubV);
  if(hp[2]>0){
    const pr=(Date.now()%1800)/1800;
    ctx.strokeStyle='rgba(255,206,106,'+((1-pr)*.85).toFixed(2)+')'; ctx.lineWidth=2.2;
    ctx.beginPath(); ctx.arc(hp[0],hp[1],6+pr*26,0,7); ctx.stroke();
    ctx.fillStyle='#ffce6a'; ctx.shadowColor='#ffce6a'; ctx.shadowBlur=18;
    ctx.beginPath(); ctx.arc(hp[0],hp[1],6,0,7); ctx.fill(); ctx.shadowBlur=0;
    ctx.font='900 13px "Malgun Gothic",sans-serif';
    const w=ctx.measureText(HUB.n).width;
    ctx.fillStyle='rgba(255,206,106,.16)';
    rr(hp[0]+11, hp[1]-11, w+15, 22, 6); ctx.fill();
    ctx.strokeStyle='rgba(255,206,106,.6)'; ctx.lineWidth=1;
    rr(hp[0]+11, hp[1]-11, w+15, 22, 6); ctx.stroke();
    ctx.fillStyle='#ffce6a'; ctx.fillText(HUB.n, hp[0]+18, hp[1]+4);
  }
}
function rr(x,y,w,h,r){ ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath(); }
function hex(c,a){
  const n=parseInt(c.slice(1),16);
  return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';
}

/* ═══════════ 조작 ═══════════ */
let dragging=false, lx=0, ly=0, moved=0;
cv.addEventListener('pointerdown',e=>{ dragging=true; moved=0; lx=e.clientX; ly=e.clientY;
  cv.classList.add('drag'); cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove',e=>{
  if(!dragging) return;
  const dx=e.clientX-lx, dy=e.clientY-ly; lx=e.clientX; ly=e.clientY;
  moved += Math.abs(dx)+Math.abs(dy);
  yaw -= dx*0.006; pitch = Math.max(-1.2, Math.min(1.2, pitch + dy*0.005));
  targetYaw=null; lastMove=performance.now();
});
cv.addEventListener('pointerup',e=>{
  dragging=false; cv.classList.remove('drag');
  if(moved<5) pick(e);
});
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  zoom = Math.max(.75, Math.min(2.2, zoom * (e.deltaY<0?1.12:0.89)));
  R=Math.min(W*0.34,H*0.42)*zoom;
},{passive:false});

function pick(e){
  const r=cv.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
  let best=-1, bd=26;
  routes.forEach((rt,i)=>{
    const p=proj(rt.v);
    if(p[2]<=0) return;
    const d=Math.hypot(p[0]-mx,p[1]-my);
    if(d<bd){ bd=d; best=i; }
  });
  if(best>=0) select(best);
}

/* ═══════════ UI ═══════════ */
function renderList(){
  document.getElementById('routes').innerHTML = routes.map((r,i)=>
    '<div class="rt'+(i===sel?' on':'')+'" onclick="select('+i+')">'+
    '<span class="dot" style="background:'+r.c+';color:'+r.c+'"></span>'+
    '<span class="nm"><b>'+r.n+'</b><span>'+r.s+' · '+r.t+'</span></span>'+
    '<span class="km">'+Math.round(r.km).toLocaleString()+'km</span></div>').join('');
}
function select(i){
  sel=i; showAllMode=false;
  const r=routes[i];
  // 카메라를 항로 중간으로
  const mid=norm(slerp(hubV, r.v, 0.5));
  targetYaw = shortest(yaw, Math.atan2(mid[0], mid[2]));
  targetPitch = Math.asin(Math.max(-1,Math.min(1,mid[1])))*0.9;
  lastMove=performance.now();
  routes.forEach(x=>{ if(x!==r) x.draw=Math.min(x.draw,1); });
  r.draw=0; r.tt=0;
  renderList();
  document.getElementById('info').innerHTML =
    '<div class="big">남해안 → '+r.n+'</div>'+
    '<span class="tagline">'+r.t+'</span>'+
    '<div class="row"><b>경유</b><i style="font-size:12.5px;color:#ffce6a">'+r.via+'</i></div>'+
    '<div class="row"><b>항로 거리</b><i>'+Math.round(r.km).toLocaleString()+'<em>km</em></i></div>'+
    '<div class="row"><b>해리</b><i>'+Math.round(r.km/1.852).toLocaleString()+'<em>NM</em></i></div>'+
    '<div class="row"><b>예상 항해</b><i>'+r.days.toFixed(1)+'<em>일</em></i></div>'+
    '<div class="row"><b>기준 속력</b><i>'+SPEED_KN+'<em>노트</em></i></div>'+
    '<div style="font-size:10.5px;color:#7b8aa8;font-weight:700;line-height:1.5;margin-top:2px">'+
    '※ 주요 해협 · 운하를 지나는 <b>실제 해상 항로</b> 기준의 근사값입니다</div>';
}
function showAll(){
  sel=-1; showAllMode=true; renderList();
  routes.forEach(r=>{ r.draw=0; });
  document.getElementById('info').innerHTML=defInfo();
}
function resetView(){ zoom=1; resize();
  const a=lookAt(20,104); yaw=a[0]; pitch=a[1]; targetYaw=null; showAll(); }
function toggleSpin(){ spin=!spin; document.getElementById('btnSpin').classList.toggle('on',spin); }
function defInfo(){
  const tot=routes.reduce((s,r)=>s+r.km,0);
  return '<div class="big">전체 '+routes.length+'개 항로</div>'+
    '<span class="tagline">항구를 클릭하면 자세히</span>'+
    '<div class="row"><b>항로 합계</b><i>'+Math.round(tot).toLocaleString()+'<em>km</em></i></div>'+
    '<div class="row"><b>가장 먼 곳</b><i style="font-size:14px">'+
      routes.slice().sort((a,b)=>b.km-a.km)[0].n+'</i></div>'+
    '<div class="row"><b>출발지</b><i style="font-size:14px">남해안 옥포</i></div>';
}

/* ═══════════ 시작 ═══════════ */
function boot(){
  landBits = decodeMask(LAND_B64);
  buildDots();
  const a0=lookAt(20,104); yaw=a0[0]; pitch=a0[1];
  buildRoutes();
  resize();
  renderList();
  document.getElementById('info').innerHTML=defInfo();
  setTimeout(()=>document.getElementById('loading').classList.add('off'), 260);
  lastMove=performance.now();
  requestAnimationFrame(frame);
}
boot();
</script>
