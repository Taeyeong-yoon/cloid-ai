<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4교시 파일검색 대시보드</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 24px;
    font-family: "Malgun Gothic", "맑은 고딕", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f6f8; color: #1c1e21;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { font-size: 13px; color: #6b7280; margin-bottom: 24px; }

  .panel {
    background: #fff; border: 1px solid #e3e5e8; border-radius: 10px;
    padding: 20px; margin-bottom: 16px;
  }
  #q {
    width: 100%; padding: 12px 14px; font-size: 15px;
    border: 1px solid #d0d3d8; border-radius: 8px; outline: none;
    font-family: inherit;
  }
  #q:focus { border-color: #2f6fed; box-shadow: 0 0 0 3px rgba(47,111,237,.12); }

  .grp { margin-top: 16px; }
  .grp-label { font-size: 12px; font-weight: 700; color: #6b7280; margin-bottom: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    padding: 6px 12px; font-size: 13px; cursor: pointer;
    border: 1px solid #d0d3d8; border-radius: 999px; background: #fff;
    font-family: inherit; color: #374151; transition: .12s;
  }
  .chip:hover { border-color: #9ca3af; }
  .chip.on { background: #2f6fed; border-color: #2f6fed; color: #fff; font-weight: 600; }
  .chip .n { opacity: .65; margin-left: 4px; font-size: 12px; }

  .bar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px; font-size: 13px; color: #4b5563;
  }
  .bar b { color: #1c1e21; }
  .reset {
    border: none; background: none; color: #2f6fed; cursor: pointer;
    font-size: 13px; font-family: inherit; padding: 0;
  }
  .reset:hover { text-decoration: underline; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th {
    text-align: left; padding: 10px 12px; background: #fafbfc;
    border-bottom: 2px solid #e3e5e8; font-size: 12px; color: #6b7280; font-weight: 700;
  }
  td { padding: 11px 12px; border-bottom: 1px solid #eef0f2; vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #f9fafb; }

  .fname {
    cursor: pointer; font-weight: 600; color: #1c1e21;
    border-bottom: 1px dashed #b8bcc4;
  }
  .fname:hover { color: #2f6fed; border-bottom-color: #2f6fed; }
  mark { background: #fff3a3; padding: 0 1px; border-radius: 2px; }

  .tag {
    display: inline-block; padding: 3px 9px; border-radius: 5px;
    font-size: 12px; background: #eef1f5; color: #4b5563; white-space: nowrap;
  }
  .ext {
    display: inline-block; min-width: 44px; text-align: center;
    padding: 3px 7px; border-radius: 4px; font-size: 11px;
    font-weight: 700; letter-spacing: .3px; text-transform: uppercase;
  }
  .e-pdf  { background: #fdecec; color: #c0392b; }
  .e-xlsx, .e-xls, .e-csv { background: #e8f5ec; color: #1e7d43; }
  .e-jpg, .e-png { background: #eaf0fd; color: #2f6fed; }

  .why { color: #6b7280; font-size: 13px; }
  .empty { padding: 40px; text-align: center; color: #9ca3af; font-size: 14px; }

  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: #1c1e21; color: #fff; padding: 11px 20px; border-radius: 8px;
    font-size: 13px; opacity: 0; transition: .22s; pointer-events: none; max-width: 90vw;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="wrap">

  <h1>4교시 파일검색 대시보드</h1>
  <div class="sub">정리일 2026-08-09 · 총 23개 파일 · 파일명 클릭 시 전체 경로 복사</div>

  <div class="panel">
    <input id="q" type="text" placeholder="파일명 검색 (예: 검사, 도면, 자재…)" autocomplete="off">

    <div class="grp">
      <div class="grp-label">폴더</div>
      <div class="chips" id="folders"></div>
    </div>

    <div class="grp">
      <div class="grp-label">확장자</div>
      <div class="chips" id="exts"></div>
    </div>
  </div>

  <div class="panel">
    <div class="bar">
      <div>총 <b id="total">23</b>개 중 <b id="shown">23</b>개 표시</div>
      <button class="reset" id="reset">필터 초기화</button>
    </div>
    <table>
      <thead>
        <tr>
          <th style="width:34%">파일명</th>
          <th style="width:8%">형식</th>
          <th style="width:20%">위치</th>
          <th style="width:38%">분류 근거</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" style="display:none">검색 결과가 없습니다.</div>
  </div>

</div>

<div id="toast"></div>

<script>
const BASE = "C:\\Users\\slave\\Desktop\\Claude교육\\4교시";

const DATA = [
  ["A블록_배관도면.pdf",        "01_도면",        '파일명 "배관도면"'],
  ["비파괴검사성적서.pdf",       "02_검사성적서",   '파일명 "검사성적서"'],
  ["용접검사성적서_H2473.pdf",  "02_검사성적서",   '파일명 "검사성적서"'],
  ["출장보고서_거제.pdf",        "03_보고서_회의록", '파일명 "보고서"'],
  ["회의록_0630.pdf",           "03_보고서_회의록", '파일명 "회의록"'],
  ["블록공정현황.xlsx",          "04_공정_자재",    '파일명 "공정현황" + 스프레드시트'],
  ["검사일정표.xls",            "04_공정_자재",    '파일명 "일정표" + 스프레드시트'],
  ["자재소요량.csv",            "04_공정_자재",    '파일명 "자재" + 표 데이터'],
  ["자재입고현황.xlsx",          "04_공정_자재",    '파일명 "자재" + 스프레드시트'],
  ["현장사진_A블록.jpg",         "05_현장사진",     '파일명 "현장사진"'],
  ["현장사진_B블록.png",         "05_현장사진",     '파일명 "현장사진"'],
  ["용접부확대_01.png",          "05_현장사진",     '파일명 "용접부확대" — 현장 촬영 이미지로 판단'],
  ["IMG_20260628_141203.jpg",  "05_현장사진",     '카메라 기본 파일명(IMG_날짜) — 촬영 사진으로 판단'],
  ["스캔_작업지시서.png",         "06_스캔_촬영본",  '파일명 "스캔"'],
  ["작업허가서_촬영본.jpg",       "06_스캔_촬영본",  '파일명 "촬영본"'],
  ["안전교육자료.pdf",           "07_교육자료",     '파일명 "교육자료"'],
  ["콘서트사진_01.jpg",       "08_개인자료",     '업무와 무관한 개인 사진'],
  ["콘서트사진_02.jpg",       "08_개인자료",     '업무와 무관한 개인 사진'],
  ["여행사진_바다.jpg",             "08_개인자료",     '업무와 무관한 개인 사진'],
  ["프로필사진.jpg",                "08_개인자료",     '업무와 무관한 개인 사진'],
  ["반려견사진.jpg",                "08_개인자료",     '업무와 무관한 개인 사진'],
  ["문서1.pdf",                 "99_미분류",       '이름만으로 내용 판단 불가'],
  ["최종_최종.pdf",              "99_미분류",       '이름만으로 내용 판단 불가']
].map(r => ({ name: r[0], folder: r[1], why: r[2], ext: r[0].split(".").pop().toLowerCase() }));

let fFolder = "ALL", fExt = "ALL", fQuery = "";

const esc = s => s.replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

function highlight(text, q) {
  const safe = esc(text);
  if (!q) return safe;
  const i = safe.toLowerCase().indexOf(esc(q).toLowerCase());
  if (i < 0) return safe;
  return safe.slice(0, i) + "<mark>" + safe.slice(i, i + q.length) + "</mark>" + safe.slice(i + q.length);
}

function buildChips(id, key, labelFn) {
  const counts = {};
  DATA.forEach(d => counts[d[key]] = (counts[d[key]] || 0) + 1);
  const keys = Object.keys(counts).sort();
  const box = document.getElementById(id);
  box.innerHTML =
    `<button class="chip on" data-v="ALL">전체<span class="n">${DATA.length}</span></button>` +
    keys.map(k => `<button class="chip" data-v="${esc(k)}">${esc(labelFn(k))}<span class="n">${counts[k]}</span></button>`).join("");
  box.addEventListener("click", e => {
    const btn = e.target.closest(".chip");
    if (!btn) return;
    box.querySelectorAll(".chip").forEach(c => c.classList.remove("on"));
    btn.classList.add("on");
    if (id === "folders") fFolder = btn.dataset.v; else fExt = btn.dataset.v;
    render();
  });
}

function render() {
  const list = DATA.filter(d =>
    (fFolder === "ALL" || d.folder === fFolder) &&
    (fExt === "ALL" || d.ext === fExt) &&
    (!fQuery || d.name.toLowerCase().includes(fQuery))
  );

  document.getElementById("shown").textContent = list.length;
  document.getElementById("empty").style.display = list.length ? "none" : "block";

  document.getElementById("rows").innerHTML = list.map(d => `
    <tr>
      <td><span class="fname" data-p="${esc(BASE + "\\" + d.folder + "\\" + d.name)}">${highlight(d.name, fQuery)}</span></td>
      <td><span class="ext e-${d.ext}">${d.ext}</span></td>
      <td><span class="tag">${esc(d.folder)}</span></td>
      <td class="why">${esc(d.why)}</td>
    </tr>`).join("");
}

let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2000);
}

document.getElementById("rows").addEventListener("click", e => {
  const el = e.target.closest(".fname");
  if (!el) return;
  const path = el.dataset.p;
  const done = () => toast("경로 복사됨 · " + path);
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(path).then(done).catch(() => fallback(path, done));
  } else {
    fallback(path, done);
  }
});

function fallback(text, done) {
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.cssText = "position:fixed;top:-999px";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); done(); } catch (_) { toast("복사 실패 — 경로: " + text); }
  document.body.removeChild(ta);
}

document.getElementById("q").addEventListener("input", e => {
  fQuery = e.target.value.trim().toLowerCase();
  render();
});

document.getElementById("reset").addEventListener("click", () => {
  fFolder = fExt = "ALL";
  fQuery = "";
  document.getElementById("q").value = "";
  document.querySelectorAll(".chips").forEach(box => {
    box.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c.dataset.v === "ALL"));
  });
  render();
});

buildChips("folders", "folder", k => k);
buildChips("exts", "ext", k => k.toUpperCase());
document.getElementById("total").textContent = DATA.length;
render();
</script>
</body>
</html>
